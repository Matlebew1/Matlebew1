<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"><animate attributeName="stop-color" values="#c2410c;#be185d;#7c3aed;#c2410c" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f59e0b"><animate attributeName="stop-color" values="#f59e0b;#c2410c;#be185d;#f59e0b" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="0" height="200"><animate attributeName="width" values="0;700;700;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="900" height="200" rx="18" fill="url(#g)"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="80" cy="40" r="6"><animate attributeName="cy" values="40;60;40" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="150" r="9"><animate attributeName="cy" values="150;125;150" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="4"><animate attributeName="cy" values="40;70;40" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g clip-path="url(#c)" transform="translate(160,0)">
    <text x="0" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#fff">Salut, moi c'est Mathieu</text>
  </g>
  <text x="160" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" opacity="0.92">Je construis mes propres outils</text>
  <text x="70" y="104" font-family="Segoe UI, Emoji, sans-serif" font-size="56">👋<animateTransform attributeName="transform" type="rotate" values="-15 90 90;20 90 90;-15 90 90" dur="1.6s" repeatCount="indefinite"/></text>
</svg>
